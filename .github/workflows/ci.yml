name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Testes Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Bibliotecas do sistema usadas pelo OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          # PyTorch só CPU: o pacote padrão traz CUDA (vários GB) que o CI não usa.
          pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          # cython-bbox compila contra Cython e NumPy já instalados.
          pip install cython numpy==2.0.2
          pip install --no-build-isolation cython-bbox==0.1.5
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Testes
        run: python -m pytest -q -p no:cacheprovider tests

  frontend:
    name: Frontend (tipos e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Tipos (tsc)
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
